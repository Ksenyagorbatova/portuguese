name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Pages deployment needs these; id-token is required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      # ONE command does three things:
      #   1. deploys Convex prod functions + schema (selected by CONVEX_DEPLOY_KEY)
      #   2. generates convex/_generated, then injects the PROD deployment URL
      #      into VITE_CONVEX_URL
      #   3. runs `npm run build` (tsc -b + vite build + 404 fallback) with that URL
      # Vite inlines import.meta.env at build time, so the URL must be present
      # DURING the build — hence build is the --cmd, not a separate step.
      - name: Deploy Convex (prod) + build frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL

      # Seed / refresh course content into prod (idempotent upsert by natural key).
      - name: Seed content (prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run seed:seedContent --prod

      # ОДНОРАЗОВЫЙ идемпотентный бэкфилл: обрезает легаси-инфляцию расписания
      # SM-2 (interval/due) под MAX_INTERVAL. reclampSchedules уже задеплоена
      # шагом выше. Повторный прогон — no-op (правит только over-cap строки).
      # УДАЛИТЬ этот шаг отдельным PR после первого успешного прогона на проде.
      - name: Reclamp SRS schedules (prod, one-time backfill)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run progress:reclampSchedules --prod

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
