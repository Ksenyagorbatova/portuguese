# Weekly dependency update PRs: npm packages and the GitHub Actions pinned by
# commit SHA in .github/workflows (Dependabot bumps the SHA + `# vX` comment).
# Cooldown delays VERSION updates after a release (supply-chain hygiene: malicious
# npm versions are usually pulled within hours/days). Dependabot SECURITY updates
# bypass cooldown — but only if enabled in repo Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    # The logo glyphs (public/favicon.svg, iOS icon/splash) are generated from
    # this font by this parser, pinned exactly: bump them deliberately, then
    # `npm run favicon:outline && npm run ios:assets` (tests catch a mismatch).
    ignore:
      - dependency-name: "@fontsource/bricolage-grotesque"
      - dependency-name: "opentype.js"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
